# Surface Duo 2: phone calls. docs/hardware/audio.md.
#
# The call's audio never passes through Linux: the modem hands it to the
# ADSP's voice services (q6voice: MVM + CVP), whose vocproc reads the
# microphones from the VA codec DMA port and plays the other party into the
# WSA codec DMA port, the same ports the HiFi verb uses. VoiceMMode1 is the
# modem's voice session of the first subscription, VoiceMMode2 the second
# (dual SIM); both are routed, the one the call uses carries the audio.
# The calls of 2026-11-08 (SIM 1, 2G) ran on VoiceMMode1. The legacy
# CS-Voice session ("default modem voice") is not routed: opening it during
# a call was followed by a hardware reset of the phone.
# The voice front ends' PCMs (hw:N,3 and hw:N,4) are held open by
# duo2-callaudio while a call is up: that starts the voice path. It also
# sets the call volume and mute (the PipeWire volume of these devices is
# mirrored into the WSA digital gain, under a cap per device, and the
# source mute into the vocproc's uplink mute).
#
#   Earpiece  the WSA8830 at the top centre of the right half ("Receiver"),
#             on WSA_SPK1 instead of SpkrLeft: SpkrLeft's ports are off
#             while it plays (they share master ports 1-3)
#   Speaker   both loudspeakers (the stock voice call used both too)
#   Mic       DMIC3, the stock handset and speakerphone mic ("south east"),
#             on both channels of the VA back end
#
# Earpiece and Speaker are two ports of one sink (same PCM): PipeWire runs
# the one port's DisableSequence and the other's EnableSequence when
# callaudiod switches (the call screen's speaker button). They are not
# ConflictingDevices on purpose: PipeWire would make two profiles of them,
# and callaudiod only switches ports. Each EnableSequence switches the
# other's amplifier ports off first, so SpkrLeft and the earpiece never
# both have theirs on.
#
# The earpiece amplifier runs in Speaker mode: its Receiver mode needs other
# SoundWire port parameters than the speakers' (stock wsa_frame_params_receiver),
# which mainline cannot switch per stream yet. Its level is only the digital
# gain, kept low by duo2-callaudio.
#
# PCMs: hw:N,0 = MultiMedia1 (ring tones, sounds during the call),
# hw:N,1 = MultiMedia2 (recording), hw:N,3/4 = VoiceMMode1/2 (no data).

SectionVerb {
	EnableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
		cset "name='WSA_CODEC_DMA_RX_0 Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1 Capture Mixer VA_CODEC_DMA_TX_0' 1"
		cset "name='WSA_CODEC_DMA_RX_0 Voice Mixer VoiceMMode2' 1"
		cset "name='VoiceMMode2 Capture Mixer VA_CODEC_DMA_TX_0' 1"
		cset "name='VoiceMMode1 Capture Switch' 1"
		cset "name='VoiceMMode2 Capture Switch' 1"
		cset "name='VoiceMMode1 Playback Switch' 1"
		cset "name='VoiceMMode2 Playback Switch' 1"
	]

	DisableSequence [
		cset "name='VoiceMMode2 Capture Mixer VA_CODEC_DMA_TX_0' 0"
		cset "name='WSA_CODEC_DMA_RX_0 Voice Mixer VoiceMMode2' 0"
		cset "name='VoiceMMode1 Capture Mixer VA_CODEC_DMA_TX_0' 0"
		cset "name='WSA_CODEC_DMA_RX_0 Voice Mixer VoiceMMode1' 0"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 0"
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "Voice"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	# Every speaker port off first (SpkrLeft shares the earpiece's master
	# ports), then the gains, the earpiece's ports last. The digital gain
	# starts at -44 dB; duo2-callaudio takes it from the call volume.
	EnableSequence [
		cset "name='SpkrLeft DAC Switch' 0"
		cset "name='SpkrLeft COMP Switch' 0"
		cset "name='SpkrLeft BOOST Switch' 0"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrRight DAC Switch' 0"
		cset "name='SpkrRight COMP Switch' 0"
		cset "name='SpkrRight BOOST Switch' 0"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='WSA_COMP2 Switch' 0"
		cset "name='WSA_RX1 INP0' ZERO"
		cset "name='WSA RX1 MUX' ZERO"
		cset "name='WSA_RX1 Digital Volume' 0"
		cset "name='WSA_RX0 Digital Volume' 40"
		cset "name='Receiver PA Volume' 12"
		cset "name='Receiver WSA MODE' Speaker"
		cset "name='WSA RX0 MUX' AIF1_PB"
		cset "name='WSA_RX0 INP0' RX0"
		cset "name='WSA_COMP1 Switch' 1"
		cset "name='Receiver BOOST Switch' 0"
		cset "name='Receiver VISENSE Switch' 0"
		cset "name='Receiver COMP Switch' 1"
		cset "name='Receiver DAC Switch' 1"
	]

	DisableSequence [
		cset "name='Receiver DAC Switch' 0"
		cset "name='Receiver COMP Switch' 0"
		cset "name='WSA_COMP1 Switch' 0"
		cset "name='WSA_RX0 INP0' ZERO"
		cset "name='WSA RX0 MUX' ZERO"
		cset "name='WSA_RX0 Digital Volume' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	# As HiFi's Speaker, with the earpiece's ports off first and a lower
	# starting gain (-34 dB; duo2-callaudio takes it from the call volume).
	EnableSequence [
		cset "name='Receiver DAC Switch' 0"
		cset "name='Receiver COMP Switch' 0"
		cset "name='Receiver BOOST Switch' 0"
		cset "name='Receiver VISENSE Switch' 0"
		cset "name='WSA_RX0 Digital Volume' 50"
		cset "name='WSA_RX1 Digital Volume' 50"
		cset "name='SpkrLeft PA Volume' 12"
		cset "name='SpkrRight PA Volume' 12"
		cset "name='WSA RX0 MUX' AIF1_PB"
		cset "name='WSA RX1 MUX' AIF1_PB"
		cset "name='WSA_RX0 INP0' RX0"
		cset "name='WSA_RX1 INP0' RX1"
		cset "name='WSA_COMP1 Switch' 1"
		cset "name='WSA_COMP2 Switch' 1"
		cset "name='SpkrLeft WSA MODE' Speaker"
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrLeft DAC Switch' 1"
		cset "name='SpkrRight WSA MODE' Speaker"
		cset "name='SpkrRight COMP Switch' 1"
		cset "name='SpkrRight BOOST Switch' 1"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='SpkrRight DAC Switch' 1"
	]

	DisableSequence [
		cset "name='SpkrLeft DAC Switch' 0"
		cset "name='SpkrLeft BOOST Switch' 0"
		cset "name='SpkrLeft COMP Switch' 0"
		cset "name='SpkrRight DAC Switch' 0"
		cset "name='SpkrRight BOOST Switch' 0"
		cset "name='SpkrRight COMP Switch' 0"
		cset "name='WSA_COMP1 Switch' 0"
		cset "name='WSA_COMP2 Switch' 0"
		cset "name='WSA_RX0 INP0' ZERO"
		cset "name='WSA_RX1 INP0' ZERO"
		cset "name='WSA RX0 MUX' ZERO"
		cset "name='WSA RX1 MUX' ZERO"
		cset "name='WSA_RX0 Digital Volume' 0"
		cset "name='WSA_RX1 Digital Volume' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphone"

	EnableSequence [
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC3"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_DEC0 Volume' 84"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA DMIC MUX1' DMIC3"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
		cset "name='VA_DEC1 Volume' 84"
	]

	DisableSequence [
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
		cset "name='VA DMIC MUX0' ZERO"
		cset "name='VA DMIC MUX1' ZERO"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 2
	}
}
