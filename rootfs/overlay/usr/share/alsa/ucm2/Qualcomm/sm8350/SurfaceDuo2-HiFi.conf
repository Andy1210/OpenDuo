# Surface Duo 2: three WSA883x amplifiers on the WSA macro's SoundWire bus
# and digital microphones on the VA macro. docs/hardware/audio.md.
#
#   SpkrLeft   WSA_RX0, stream channel 0: the loudspeaker at the top of the
#              LEFT half
#   SpkrRight  WSA_RX1, stream channel 1: the loudspeaker at the bottom right
#              of the RIGHT half
#   Receiver   the earpiece, top centre of the right half (WSA8830); it takes
#              SpkrLeft's place on WSA_SPK1 (same master ports), only in the
#              Voice Call verb: its ports stay off here
#
# There is no speaker protection (the stock one runs on the ADSP): the
# machine driver caps WSA_RX0/1 Digital Volume at 81 (-3 dB) and the PA
# Volume at 17 (0 dB). The gains here are fixed and below those caps
# (digital -16 dB, PA -3 dB, the bottom of its scale: 0..15 are all -3 dB);
# the volume is PipeWire's software volume, so 100 % there reaches the
# amplifier at -16 dBFS at most.
#
# PCMs: hw:N,0 = MultiMedia1 (playback), hw:N,1 = MultiMedia2 (capture).
# The back ends are fixed at 48 kHz, 2 channels, S16_LE (sm8250.c).

SectionVerb {
	EnableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	DisableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	# The gains first, the DAC ports last. Nothing powers up here: DAPM
	# switches the path (and the PA) on only while a stream runs.
	EnableSequence [
		cset "name='WSA_RX0 Digital Volume' 68"
		cset "name='WSA_RX1 Digital Volume' 68"
		cset "name='SpkrLeft PA Volume' 12"
		cset "name='SpkrRight PA Volume' 12"
		cset "name='WSA RX0 MUX' AIF1_PB"
		cset "name='WSA RX1 MUX' AIF1_PB"
		cset "name='WSA_RX0 INP0' RX0"
		cset "name='WSA_RX1 INP0' RX1"
		cset "name='WSA_COMP1 Switch' 1"
		cset "name='WSA_COMP2 Switch' 1"
		cset "name='SpkrLeft WSA MODE' 0"
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrLeft DAC Switch' 1"
		cset "name='SpkrRight WSA MODE' 0"
		cset "name='SpkrRight COMP Switch' 1"
		cset "name='SpkrRight BOOST Switch' 1"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='SpkrRight DAC Switch' 1"
	]

	DisableSequence [
		cset "name='SpkrLeft DAC Switch' 0"
		cset "name='SpkrLeft BOOST Switch' 0"
		cset "name='SpkrLeft COMP Switch' 0"
		cset "name='SpkrRight DAC Switch' 0"
		cset "name='SpkrRight BOOST Switch' 0"
		cset "name='SpkrRight COMP Switch' 0"
		cset "name='WSA_COMP1 Switch' 0"
		cset "name='WSA_COMP2 Switch' 0"
		cset "name='WSA_RX0 INP0' ZERO"
		cset "name='WSA_RX1 INP0' ZERO"
		cset "name='WSA RX0 MUX' ZERO"
		cset "name='WSA RX1 MUX' ZERO"
		cset "name='WSA_RX0 Digital Volume' 0"
		cset "name='WSA_RX1 Digital Volume' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

# The stock handset mic is DMIC3 ("south east mic", also the wake-word
# mic), the second (noise suppression, endfire pair) DMIC1. The silent DMIC
# scan (docs/hardware/audio.md) found signal on the DMIC0/1 and DMIC2/3 data
# lines and none on DMIC4/5, one microphone per line most likely.
SectionDevice."Mic" {
	Comment "Built-in microphones"

	EnableSequence [
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC3"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_DEC0 Volume' 84"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA DMIC MUX1' DMIC1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
		cset "name='VA_DEC1 Volume' 84"
	]

	DisableSequence [
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
		cset "name='VA DMIC MUX0' ZERO"
		cset "name='VA DMIC MUX1' ZERO"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 2
	}
}

# The earpiece is a device of the Voice Call verb (SurfaceDuo2-VoiceCall.conf).
