# Microsoft Surface Duo 2 (card "Microsoft-SurfaceDuo2"). docs/hardware/audio.md.
Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8350/SurfaceDuo2-HiFi.conf"
	Comment "Speakers and built-in microphones"
}

# Only with a kernel that has the voice front ends and the earpiece on the
# card (the q6voice series, 2026-11-07); an older one keeps HiFi alone.
If.voicecall {
	Condition {
		Type ControlExists
		Control "name='VoiceMMode1 Capture Switch'"
	}
	True.SectionUseCase."Voice Call" {
		File "/Qualcomm/sm8350/SurfaceDuo2-VoiceCall.conf"
		Comment "Phone call: earpiece or speakers, built-in microphone"
	}
}
