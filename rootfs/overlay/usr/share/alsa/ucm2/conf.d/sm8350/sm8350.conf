# Qualcomm SM8350 boards: card driver "sm8350" (sound/soc/qcom/sm8250.c,
# the qcom,sm8350-sndcard entry). alsa-lib looks here when no file is named
# after the card's long name (which comes from DMI and carries the SKU).
# The board is told by the card name, which the device tree sets.
Syntax 4

If.SurfaceDuo2 {
	Condition {
		Type RegexMatch
		String "${CardName}"
		Regex "^Microsoft-SurfaceDuo2$"
	}
	True.Include.duo2.File "/Qualcomm/sm8350/Microsoft-SurfaceDuo2.conf"
	False.Error "SM8350 - ${CardName} model not supported"
}
