# The pen's settings for duo2-touchd and duo2-pend (Duo Settings > Pen writes this file;
# both read it again by themselves when it changes).
#
# palm_rejection: the touches of the hand that holds the pen are ignored
# while the pen is near the screen (and 0.3 s after it left):
#   both    on both screens (the default: the other hand holds the phone)
#   panel   only on the screen the pen is over
#   off
palm_rejection = both

# The pen's haptics (a Surface Slim Pen 2 paired over Bluetooth; duo2-pend
# reads these again by itself and sets the pen at every connection):
# writing_feel: the pen buzzes softly while its tip touches the screen,
#   off | ink | pencil | marker | chisel | brush
# feel_strength: 1..100 (%), for the writing feel and the click
# button_click: on | off, a short click in the pen when its top button is pressed
writing_feel = off
feel_strength = 50
button_click = off

# Apps (games such as Nibfair) may ask duo2-pend for a pulse in the pen through
# /run/duo2-pen/haptics, writable by the GUI user's group (app_haptics_group =
# NAME picks another group): on | off
#app_haptics = on
