# duo2-os: geoclue for the Duo 2 (docs/hardware/location.md).
#
# The shell is the agent (it asks the user per app, shell/duo-shell/
# duoshell/location.py). Positions come from the modem: its GNSS engine
# (ModemManager's gps-nmea, started only while an app asks for an exact
# position and stopped when none does) and the serving cell (3gpp-lac-ci),
# looked up at BeaconDB (an open, community-run Ichnaea-compatible service:
# the cell, and with the WiFi source the access points nearby, are sent there
# only while an allowed app asks; nothing is submitted).

[agent]
whitelist=org.duo2os.Shell

[network-nmea]
# no NMEA from the local network (it would bring avahi in)
enable=false

[3g]
enable=true

[cdma]
enable=false

[modem-gps]
enable=true

[wifi]
# The WiFi source reads the access points from wpa_supplicant's D-Bus
# interface, which the phone's wpa_supplicant@wlan0 does not offer (no -u):
# with the source on, geoclue's proxy would D-Bus-activate a second
# wpa_supplicant. Off until wpa_supplicant@wlan0 runs with -u (the owner's
# step); the URL serves the cell lookups too.
enable=false
url=https://api.beacondb.net/v1/geolocate
submit-data=false

[compass]
# iio-sensor-proxy has no compass on the Duo 2
enable=false

[static-source]
enable=false
