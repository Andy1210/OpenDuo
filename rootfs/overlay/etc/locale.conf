# Default: English interface, European formats (24-hour clock, Monday first,
# metric, A4). Changed by Duo Settings > Language & region (through
# duo-settings-helper); /etc/default/locale is a link to this file.
# duo-wc.service reads it (EnvironmentFile), so every app has it.
LANG=en_US.UTF-8
LC_NUMERIC=en_GB.UTF-8
LC_TIME=en_GB.UTF-8
LC_MONETARY=en_GB.UTF-8
LC_PAPER=en_GB.UTF-8
LC_MEASUREMENT=en_GB.UTF-8
