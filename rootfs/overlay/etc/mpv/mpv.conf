# duo2-os: hardware video decoding on the SM8350 video core (the iris driver,
# a V4L2 stateful mem2mem decoder, /dev/video0; docs/hardware/video.md).
# mpv reads this file, and so does Celluloid (its gschema override in
# shell/duo-apps loads it). The decoder writes NV12 into its own buffers and
# mpv copies each frame out (the only mode mpv has for a stateful decoder):
# decoding a 1080p30 H.264 or HEVC file takes ~15 % of a core instead of
# ~120 %, and Celluloid showing it on a panel ~30-45 % instead of ~120-150 %.
# Where the decoder cannot open (no /dev/video0, no access to it), mpv
# decodes in software as before.
hwdec=v4l2m2m-copy
# VP9 stays in software: with FFmpeg's VP9 wrapper the driver stops the
# stream after a few hundred frames ("error in ftb done").
hwdec-codecs=h264,hevc
# ... and only for the streams it decodes: 10-bit or interlaced H.264 / HEVC
# goes to software before a decoder is opened (the script says why).
scripts-append=/etc/mpv/duo2-hwdec.lua
