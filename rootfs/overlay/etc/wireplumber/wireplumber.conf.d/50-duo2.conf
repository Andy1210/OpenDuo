# duo2-os: WirePlumber for the one user (the GUI user), whose PipeWire runs under
# the lingering user manager (systemd --user), docs/hardware/audio.md.

wireplumber.profiles = {
  main = {
    # The BlueZ monitor would wait for an active logind session on a seat,
    # which this phone never has (duo-wc runs on seatd, ssh logins have no
    # seat): Bluetooth audio would never show up.
    monitor.bluez.seat-monitoring = disabled
  }
}

wireplumber.settings = {
  # A speaker route seen for the first time starts at 30 % (wpctl and pactl
  # show the cubic volume: 0.3^3 = 0.027 linear, -31 dB). Later the volume
  # the user set is restored (~/.local/state/wireplumber).
  device.routes.default-sink-volume = 0.027
}
