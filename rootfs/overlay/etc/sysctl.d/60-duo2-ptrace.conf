# duo2-os: a process may ptrace only its own descendants (Yama), so an app of
# the GUI user cannot attach to the shell, the lock or the on-screen keyboard
# and use their trusted connections (docs/hardware/security.md). The
# current kernel has no Yama (CONFIG_SECURITY_YAMA is off): the leading "-"
# makes systemd-sysctl skip the key quietly until a kernel with Yama comes.
-kernel.yama.ptrace_scope = 1
