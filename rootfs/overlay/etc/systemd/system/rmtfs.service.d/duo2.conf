# Surface Duo 2: rmtfs runs once the modem remoteproc exists (the udev rule
# 90-duo2-rmtfs.rules starts it from the device; it is not in
# multi-user.target), and never gives up restarting: a stopped rmtfs means a
# modem that cannot open its EFS and is shot down by its watchdog.
[Unit]
After=sys-subsystem-remoteproc-modem.device
StartLimitIntervalSec=0

[Service]
RestartSec=2
