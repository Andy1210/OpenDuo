# duo2-os: geoclue switches the modem's GNSS engine on for an app that wants
# an exact position and off when the last one stops. If geoclue goes without
# doing so (killed, crashed, stopped while in use), the engine would keep
# running and drawing power: switch it off after every stop (as root, + ).
[Service]
ExecStopPost=+-/bin/sh -c 'mmcli -m any --location-disable-gps-nmea --location-disable-gps-raw >/dev/null 2>&1 || true'
