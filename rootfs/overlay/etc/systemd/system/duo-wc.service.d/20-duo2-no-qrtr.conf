# duo2-os: no QRTR for the GUI user's programs (docs/hardware/security.md,
# "QRTR"). duo-wc starts the session, the session the shell, the shell every
# app: all of them inherit this seccomp filter, also across sudo / setuid
# exec, and none can remove it. socket(AF_QIPCRTR) fails with EAFNOSUPPORT,
# so no app talks QMI to the modem (calls, SMS) or to the sensors' DSP
# around ModemManager and iio-sensor-proxy. What needs QRTR runs as a
# system service (PID 1 starts it: no filter); a root helper the GUI runs
# through sudo starts its QRTR part with systemd-run (duo2-esim).
# systemd 257 installs the filter before dropping to User= (it keeps
# CAP_SYS_ADMIN for that), so NoNewPrivileges stays off and sudo works.
[Service]
RestrictAddressFamilies=~AF_QIPCRTR
