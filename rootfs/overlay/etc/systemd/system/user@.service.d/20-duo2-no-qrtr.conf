# duo2-os: no QRTR for the users' own programs (docs/hardware/security.md,
# "QRTR"): the user manager (systemd --user) and everything it starts (the
# session bus and what it activates, PipeWire, Calls, Chatty, the Waydroid
# session, `systemd-run --user`, Flatpak apps) inherit this seccomp filter,
# also across sudo / setuid exec. Same filter as duo-wc.service's
# (20-duo2-no-qrtr.conf there), and why the two: an app can reach the user
# manager (systemctl --user, D-Bus activation) as well as fork in the session.
[Service]
RestrictAddressFamilies=~AF_QIPCRTR
