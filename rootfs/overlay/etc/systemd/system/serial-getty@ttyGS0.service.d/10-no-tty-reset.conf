# The console on the USB gadget (CDC-ACM, ttyGS0): no terminal reset.
#
# systemd resets a unit's TTY before starting it and after it stops, and
# holds a lock on /dev/console while it does. On the gadget port that reset
# writes to a tty nobody drains while no USB host has the port open (the
# phone on battery, or a host with the ACM port closed), so the write never
# completes and the console lock is never released: the next unit that
# resets any TTY (a getty, a compositor on tty1) then blocks PID 1 for good
# (seen 2026-11-06: ssh logins hung). A gadget port has no terminal state
# worth resetting, so it is not reset; agetty itself may still wait on the
# port, which blocks nobody else.
[Service]
TTYReset=no
TTYVHangup=no
TTYVTDisallocate=no
