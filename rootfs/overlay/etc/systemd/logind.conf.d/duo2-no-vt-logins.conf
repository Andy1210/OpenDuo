# Surface Duo 2: no text logins on the virtual consoles. duo-wc runs on tty1
# (seatd's VT-bound seat), fbcon is not bound to the panels (fbcon=map:1, see
# docs/hardware/boot.md) and there is no keyboard; a getty
# there only reset the VT to text mode under duo-wc. Logins: ssh, ttyGS0.
[Login]
NAutoVTs=0
ReserveVT=0
