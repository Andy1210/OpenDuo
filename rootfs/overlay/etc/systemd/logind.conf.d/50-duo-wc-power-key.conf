# duo-wc owns the power key: a short press switches the panels off and on
# (and suspends only with power_key_suspend = on in /etc/duo-wc/duo-wc.conf).
# Also in the rootfs image (rootfs/overlay), so a fresh image never powers
# off on a press, with or without duo-wc. Without this, logind's default (HandlePowerKey=poweroff) shuts the phone
# down on every press. Installed by compositor/duo-wc/install.sh as
# /etc/systemd/logind.conf.d/50-duo-wc-power-key.conf.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
