# duo2-os: duo2admin is the ssh-only administrator (rootfs/Dockerfile). Its
# logins start a user manager (pam_systemd), which started the GUI user's
# services for it too (PipeWire, WirePlumber, mmsd-tng, duo2-callaudio,
# gvfs, ...): CPU, memory and battery for nothing, and a second mmsd-tng
# could fetch an MMS away from the GUI user. No user unit runs for it.
[Unit]
ConditionUser=!duo2admin
