# OpenDuo: ssh is key-only, for everyone (docs/hardware/security.md), and
# runs only while Settings > Developer switches it on (devmode/README.md; the
# firewall lets it in on the WiFi and the USB network only). The GUI user has
# no sudo; duo2admin is the administrator (sudo, no GUI session), whose
# ~/.ssh/authorized_keys Settings > Developer manages.
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitRootLogin no

# Everyone but the administrator: the keys are root's file
# (/etc/ssh/authorized_keys.d/USER; docs/hardware/security.md, QRTR). The
# GUI user's own ~/.ssh/authorized_keys could be written by any app, which
# could then log in over ssh as that user, outside the QRTR filter of
# duo-wc's session and the user manager. A Match block in an included file
# ends with the file (checked with `sshd -T -C user=...`: only this line
# differs between the GUI user and duo2admin).
Match User *,!duo2admin
    AuthorizedKeysFile /etc/ssh/authorized_keys.d/%u
