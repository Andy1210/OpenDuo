# duo2-os: the WiFi country (regulatory domain), hotspot/README.md
# "Regulatory domain". Read by duo2-wifi-country at every check; the package
# default is /etc/duo2/wifi-country.conf.dist, this file is never overwritten.
#
#   auto  the mobile network's country (its MCC; the SIM's home country never
#         counts); without a network nothing is set (11d or the firmware's
#         world domain decide)
#   XX    always this country (ISO 3166 alpha-2, e.g. DE)
#   off   never set one
COUNTRY=auto
