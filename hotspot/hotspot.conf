# duo2-os: the hotspot's administrator switches (hotspot/README.md).
# Read at every start of the hotspot (the package default is
# /etc/duo2/hotspot.conf.dist; this file is never overwritten). The user's
# own choices (name, band, security, ...) are Duo Settings', in
# /var/lib/duo2/hotspot/settings.

# yes = the phone's own WiFi connection is never switched off for the
# hotspot, whatever the user chose (a development phone reached over WiFi
# ssh): when the hotspot cannot run beside it, it does not start.
NEVER_CUT_WIFI=yes

# While the phone is on a WiFi network the hotspot uses that network's
# channel. yes = when that channel cannot be shared (radar / DFS channels
# are not allowed for an access point), another channel beside it (the chip
# switches between the two); no = then the hotspot does not start.
OTHER_CHANNEL=yes

# At most this many devices at once.
MAX_CLIENTS=8

# The access point's channel without a WiFi connection of the phone's own.
CHANNEL_5=36
CHANNEL_24=6

# The devices' subnets: the first one that overlaps nothing the phone has.
SUBNETS_WIFI="10.15.43.0/24 192.168.43.0/24 172.20.43.0/24"
SUBNETS_USB="10.15.44.0/24 192.168.44.0/24 172.20.44.0/24"

# The mobile data devices (duo2-wwan's bearer).
UPLINKS="qmapmux* rmnet_data* wwan*"

# IPv6 for the devices: nat66 (a private prefix, masqueraded to the phone's
# mobile IPv6 address) or no.
IPV6=nat66
