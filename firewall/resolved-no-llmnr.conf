# OpenDuo (firewall/README.md): systemd-resolved does not answer name queries
# from the network. LLMNR listened on port 5355 of every interface (Windows'
# local name lookup, unused here), multicast DNS likewise when on; the phone
# looks names up through DNS only. The firewall drops both ports anyway.
[Resolve]
LLMNR=no
MulticastDNS=no
