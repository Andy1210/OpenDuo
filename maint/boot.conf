# The packaged kernels' boot entries (duo2-boot, docs/UPDATES.md "The kernel
# and its way back"). An empty value takes what the known-good entry
# (/boot/efi/loader/entries/duo2.conf) has, else the kernel package's default.
#
# the kernel's options
options =
# the DTB file name (one of the kernel package's), e.g.
# sm8350-microsoft-surface-duo2-bringup-j.dtb
dtb =
# the initramfs on the ESP, e.g. /duo2/initrd-boot.img (never the rescue
# entry's copy: that one is renewed by hand only)
initrd =
# how often a new kernel is tried before systemd-boot boots the previous one
tries = 3
# how many good packaged kernels stay on the ESP (the running one always stays)
keep = 2
# seconds of awake time a new kernel has for its checks (compositor, touch, network)
health_timeout = 300
# restart into the previous kernel at once when the phone is not usable
# (no picture, no touch, no radio at all)
reboot_on_failure = yes
