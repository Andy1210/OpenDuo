# duo2-os: the container manager starts on demand (D-Bus activation of
# id.waydro.Container by the first Waydroid session; the unit is disabled at
# boot), refuses to start unhardened (duo2-waydroid-prestart), and is stopped
# again by duo2-waydroid-reaper.timer once no container has run for a while.
# docs/hardware/android.md.
[Service]
ExecStartPre=/usr/local/sbin/duo2-waydroid-prestart
