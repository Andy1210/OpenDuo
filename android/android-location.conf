# duo2-android-location: the phone's position for Android apps (Waydroid),
# docs/hardware/location.md. Read when the Android session starts; the GUI user's
# ~/.config/duo2/android-location.conf (same keys) is read after this one.
# Whether Android apps may have the position at all is not here: the shell's
# Location switch and Settings > Privacy > "Android apps".

# also a "network" test provider (Android's network location, fed with the
# mobile cell's coarse position; Google's own network location cannot work in
# the container): yes / no
NETWORK=yes
# seconds the position keeps coming after the last Android app stopped asking
# (an app that asks again at once does not restart the satellite search)
LINGER_S=10
# keep the phone from sleeping while an Android app uses the GPS (navigation
# with the panels dark): yes / no
KEEP_AWAKE=yes
# a fix goes to Android's "gps" provider only if at least this exact (m): the
# mobile cell's guesses (hundreds of metres or more) go to "network" only
GPS_MAX_ACCURACY_M=200
