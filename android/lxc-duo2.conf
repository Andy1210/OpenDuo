# duo2-os: the host's hardening of the Waydroid container. Included LAST by
# /var/lib/waydroid/lxc/waydroid/config (duo2-waydroid-patch writes the
# include when Waydroid writes the config; duo2-waydroid-prestart checks it
# before every container manager start), so these values win.
# docs/hardware/android.md.

# Devices: this list and nothing else, whatever is bind-mounted into the
# container or mknod'ed inside it (the container's root keeps CAP_MKNOD).
# Not here, so never opened from Android: the UFS disks and partitions
# (sfpd, persist, modem), the cameras and the video codec, framebuffers,
# raw input (/dev/input, uhid, uinput), hidraw, rpmsg / fastrpc / QRTR
# devices, gpio, rtc, /dev/mem, the kernel log, the DRM card node (KMS).
lxc.cgroup2.devices.deny = a
# null, zero, full, random, urandom
lxc.cgroup2.devices.allow = c 1:3 rwm
lxc.cgroup2.devices.allow = c 1:5 rwm
lxc.cgroup2.devices.allow = c 1:7 rwm
lxc.cgroup2.devices.allow = c 1:8 rwm
lxc.cgroup2.devices.allow = c 1:9 rwm
# tty, ptmx and the container's own pseudo terminals
lxc.cgroup2.devices.allow = c 5:0 rwm
lxc.cgroup2.devices.allow = c 5:2 rwm
lxc.cgroup2.devices.allow = c 136:* rwm
# /dev/kmsg: create only (Android's init mknods it and stops without it; it
# can neither read the host's kernel log nor write into it)
lxc.cgroup2.devices.allow = c 1:11 m
# fuse (Android's /storage), tun (VPN apps, inside the container's network)
lxc.cgroup2.devices.allow = c 10:229 rwm
lxc.cgroup2.devices.allow = c 10:200 rwm
# the GPU's render node (Mesa freedreno in Android; no KMS)
lxc.cgroup2.devices.allow = c 226:128 rwm
# the binder devices of Waydroid's binderfs (a dynamic major, written at
# every container manager start)
lxc.include = /run/duo2-waydroid/lxc-devices.conf

# Capabilities: Waydroid's list (config_base). Android's init refuses to
# start a service whose capabilities are not in the bounding set (logd wants
# syslog + audit_control), so the ones the host does not want used are
# denied by the AppArmor profile instead: the services start, the use fails.

# AppArmor (/etc/apparmor.d/lxc-duo2-waydroid): what root inside Android may
# mount and write (no procfs / sysfs / debugfs read-write, ...)
lxc.apparmor.profile = lxc-duo2-waydroid

# seccomp: Waydroid's list plus bpf, perf_event_open and the new mount API
lxc.seccomp.profile = /etc/duo2/waydroid/waydroid.seccomp
