# duo2-os Waydroid settings (docs/hardware/android.md).
# Minutes without an Android window after which the Android session stops
# (duo2-waydroid-idle, the GUI user's), and minutes without a container after
# which the root container manager stops (duo2-waydroid-reaper). The next
# Android app starts both again (~15-25 s).
IDLE_MIN=5
# Keep Android running without a window (no idle stop, no freeze), so
# messengers stay connected and notify; costs battery. The user's switch:
# Duo Settings > Android apps (~/.config/duo2/waydroid.conf wins over this).
#KEEP_RUNNING=no
