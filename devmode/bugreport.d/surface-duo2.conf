# What a bug report adds on the Surface Duo 2 (devmode/README.md, "Bug
# report"). One item a line, masked like the rest:
#   NAME: command arg...     the command's output (run as root, no shell, 30 s)
#   NAME < /path             a file
build.txt < /etc/duo2-release
modem.txt: mmcli -m any
modem.txt: mmcli -m any --voice-list-calls
duo2-services.txt: systemctl status --no-pager --lines=0 duo2-touchd.service duo2-pend.service duo-posed.service duo-brightness.service hexagonrpcd.service rmtfs.service ModemManager.service duo2-wwan.service duo2-autosleep.service duo2-hotspot.service
touch.txt < /etc/duo2/touch-mode
touch.txt < /run/duo2-touchd.fallback
pen.txt < /etc/duo2/pen.conf
autosleep.txt < /etc/duo2/autosleep.conf
batteries.txt: sh -c "grep -H . /sys/class/power_supply/*/status /sys/class/power_supply/*/capacity /sys/class/power_supply/*/health 2>/dev/null"
thermal.txt: sh -c "grep -H . /sys/class/thermal/thermal_zone*/type /sys/class/thermal/thermal_zone*/temp 2>/dev/null"
