# xdg-desktop-portal-wlr for duo2-os (shell/duo-screencast, docs/SCREENCAST.md).
# Read by path (`--config`, the portal launcher), never from ~/.config.
[screencast]
# The touch chooser: prints the panel (DSI-1, DSI-2) or nothing (declined).
chooser_type=simple
chooser_cmd=/usr/local/lib/duo-screencast/chooser
# A video call needs no more; each frame is drawn again for the stream.
max_fps=30
# A notification while the screen is shared.
exec_before=/usr/local/lib/duo-screencast/notify start
exec_after=/usr/local/lib/duo-screencast/notify stop
