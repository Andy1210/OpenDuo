# GNOME Software (48): a section of apps on the Explore page, chosen by the
# deployment. Apps whose AppStream data carries
#   <custom><value key="GnomeSoftware::DeploymentFeatured">duo2-os</value></custom>
# are shown under Title; works-on-duo.xml (generated from works-on-duo.txt by
# gen-featured.py) marks them. Installed into /etc/xdg/gnome-software/.
[Deployment Featured Apps]
Title=Works well on the Duo
Title[hu]=Jól megy a Duón
Selector=duo2-os
