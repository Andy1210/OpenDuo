# duo2-os: Qt and Kirigami apps (Angelfish) on duo-wc, without Plasma.
# Read by the user manager (systemd environment.d: D-Bus-activated apps) and
# by duo-wc's session (compositor/duo-wc/dist/session: apps the shell starts).
# Native Wayland (there is no X server), the KDE platform theme and desktop
# style without Plasma (the dark Breeze colours of /etc/xdg/kdeglobals), and
# Kirigami's phone layout (Angelfish's mobile UI).
QT_QPA_PLATFORM=wayland
QT_QPA_PLATFORMTHEME=kde
QT_QUICK_CONTROLS_STYLE=org.kde.desktop
QT_QUICK_CONTROLS_MOBILE=1
