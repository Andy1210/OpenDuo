# xdg-desktop-portal backends for duo2-os (installed by shell/duo-shell/install.sh
# into /etc/xdg/xdg-desktop-portal/portals.conf).
#
# The GTK backend serves org.freedesktop.portal.Settings from GSettings: its
# org.freedesktop.appearance color-scheme is what libadwaita apps follow
# (org.gnome.desktop.interface color-scheme = prefer-dark, from
# 90_duo2-os.gschema.override). The portal itself is started by D-Bus
# activation on the session's bus when an app first asks.
#
# Screen sharing and screenshots: xdg-desktop-portal-wlr on duo-wc's capture
# protocols, with the touch chooser (shell/duo-screencast, docs/SCREENCAST.md).
# duo-wc's session starts it (not D-Bus activation: it needs a capture
# connection only the session can give).
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
