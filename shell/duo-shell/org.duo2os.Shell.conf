<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- duo2-os: duo-shell's remote on the system bus (duoshell/shellbus.py):
     the GUI user's shell owns the name, only root may call it (the
     administrator through sudo; the shell checks the caller's uid too).
     Installed into /etc/dbus-1/system.d/ with @USER@ = the GUI user. -->
<busconfig>
  <policy user="@USER@">
    <allow own="org.duo2os.Shell"/>
  </policy>
  <policy user="root">
    <allow send_destination="org.duo2os.Shell" send_interface="org.duo2os.Shell"/>
    <allow send_destination="org.duo2os.Shell" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
