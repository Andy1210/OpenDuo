# duo-posed: the sensors drive duo-wc's pose and rotation.
# Read at start and on SIGHUP (sudo systemctl reload duo-posed after a change).
# Quick switch for all of it: sudo duo2-sensors-mode on|off|status.
# /etc/duo-posed.conf is never overwritten; this documented copy is
# /etc/duo-posed.conf.dist.

# on: act on what the sensors say (rotation, poses, the closed phone).
# off: only read the sensors and LOG what it would do ("would: set_pose ..."),
#      never call duo-wc (Settings > Rotation & poses > Use the sensors).
enabled = on

# The two halves of the policy.
auto_pose = on
auto_rotate = on
# The panels in use: both (the sensors decide), left or right (only that one,
# whatever the fold says; a closed phone still goes dark). Duo Settings > Rotation
# & poses and the quick menu's Panels tile write it.
#panels = both

# posture: Microsoft's posture classifier on the SLPI (closed / peek / read /
#          compose / open / tent / brochure / flip, with the side in use).
# hinge:   the SLPI's hinge_angle sensor, with the bands below (the panel kept
#          in the one-panel poses is the one whose face points up, else the
#          one touched last).
# accel:   a hinge angle estimated from the two accelerometers, same bands.
#          Blind while the hinge is vertical (a book held upright): the pose
#          then stays as it was.
# auto:    the first of these the SSC has. On this firmware posture and
#          hinge_angle do not come up (the magnetometers are missing), so auto = accel.
pose_source = auto

# closed (hinge ~0): blank = both panels off (the power key or opening the
# phone brings them back); none = leave it to duo-wc's idle timeout.
closed_action = blank
# Tell duo-wc the posture (set_posture): the shell then locks a phone that is
# folded closed (duo-lock, swipe to unlock), peeking at a closed phone (opened
# a little) shows the clock, battery and notification icons on the panels'
# outer edges, and the power key of a closed phone shows a thin clock on the
# strip next to the hinge for 5 s. off: none of that.
forward_posture = on
# Folded back (flip_*): the panel kept on is the one facing the user, and the
# other one is switched off (its touch is ignored with it). posture = the side
# Microsoft's posture names; accel = the panel whose face points up, when the
# accelerometers can tell (held vertically they cannot: then the posture).
flip_facing = posture
# Opening a phone that duo-posed blanked because it was closed lights it again.
wake_on_open = on
# The sensors whose events the sensor DSP sends while the phone sleeps (the
# others it holds back until the phone is up): opening or closing the phone
# then wakes it, if the kernel lets the sensor DSP wake it (qrtr.wake_services
# with 400, the sensor service).
wake_sensors = hall,posture
# always: opening and closing a sleeping phone wake it (closing then only blanks
# and locks, and it goes back to sleep); closed: only a closed (or nearly closed)
# phone sends them, so closing an open sleeping phone does not wake it, but
# opening it again afterwards does not either.
wake_sensors_when = always

# What a posture means, overriding the built-in table; a value is a duo-wc
# pose (dual, span, single left, single right), blank, or keep.
#posture.peek_left = keep
#posture.peek_right = keep
#posture.read = dual
#posture.compose = dual
#posture.open_dpm = dual
#posture.open_dlm = dual
#posture.tent_left = single left
#posture.flip_p_left = single left

# Which connector is which half.
left_output = DSI-1
right_output = DSI-2
# hw_id of the accelerometer behind the LEFT panel (0 = the SSC's "display"
# rigid body, 1 = "keyboard"). Verified 2026-11-07 from the owner's pose check:
# with 0 the accelerometer hinge estimate came out mirrored (folded back 2-4
# degrees, peek 354, book 223) and tent rotated upside down: it is 1.
accel_left = 1

# Rotation from the accelerometers: they stream only while a panel is lit, or
# while duo-posed blanked a closed phone (pose_source accel: to see it open).
# Rate (Hz; 26 is the LSM6DST's lowest) and SSC batching (ms: the AP wakes for
# a batch, not for every sample). While they stream the SLPI does not reach its
# sleep state; with the screen dark it does.
accel_rate = 26
accel_batch_ms = 100
# A new rotation must hold this long, the up direction must be within
# 45 - hysteresis degrees of the new quarter turn, and the panel must stand
# up at least this much (|in-plane gravity| / g; a panel lying flat says nothing).
rotation_settle_ms = 350
rotation_hysteresis_deg = 15
rotation_min_tilt = 0.45

# A new pose must hold this long (the posture sensor adds ~300 ms of its own).
pose_settle_ms = 500
# Hinge bands (closed < 12, peek < 40, open < 215, convex < 330, flipped) are
# left only this far past their edge.
hinge_margin_deg = 6
# accel hinge: gravity across the hinge axis needed in both halves, in g.
hinge_min_proj = 0.5

# Seconds between reads of duo-wc's state (lit / blanked / pose).
state_poll_s = 3

# duo2-touchd (touch): the lit panels, the hinge angle and the orientation, as
# Android tells the stock touch HAL, go to this file whenever they change; the
# daemon (in its stitched mode) passes them to Microsoft's heat processor,
# which picks its geometry from them. touch_handedness = left | right is
# passed too (empty: the heat processor's own default).
touch_pose = on
touch_pose_file = /run/duo-posed/touch
touch_handedness =
