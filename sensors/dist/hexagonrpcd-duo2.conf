# hexagonrpcd for the Surface Duo 2 (drop-in for Debian's hexagonrpcd.service):
# the SLPI (sensor DSP) through /dev/fastrpc-sdsp, attached to its sensors
# process (-s), our patched build (sensors/patches/hexagonrpc: sns_reg_version,
# the sns_registry interface), and the files built from the phone's own stock
# images by scripts/build-sensors-runtime.sh (not redistributable, not in the
# image: installed by scripts/install-sensors.sh). Started by Debian's
# [Install] (default.target) and by 90-duo2-sensors.rules when the device appears.
[Unit]
ConditionPathExists=/usr/share/qcom/sm8350/Microsoft/surfaceduo2/sensors/registry
ConditionPathExists=/usr/local/bin/hexagonrpcd
# Debian's unit orders itself after multi-user.target; the sensors are wanted
# earlier than that, and only the SLPI's FastRPC device matters.
After=
After=systemd-udevd.service

[Service]
ExecStart=
ExecStart=/usr/local/bin/hexagonrpcd -f /dev/fastrpc-sdsp -d sdsp -s -R /usr/share/qcom/sm8350/Microsoft/surfaceduo2
# The FastRPC device appears once the SLPI's glink channel is up; until then,
# and if the SLPI restarts, hexagonrpcd exits and comes back.
Restart=always
RestartSec=5
