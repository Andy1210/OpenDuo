# iio-sensor-proxy with SSC support (drop-in for Debian's iio-sensor-proxy.service):
# the 3.9 build from scripts/build-sensors.sh (Debian's 3.7 has no SSC). The
# SSC lists its sensors a few seconds after hexagonrpcd attaches, and the proxy
# probes only once, so it waits for the accelerometer first.
[Unit]
ConditionPathExists=/usr/local/libexec/iio-sensor-proxy
After=hexagonrpcd.service
Wants=hexagonrpcd.service

[Service]
ExecStartPre=-/usr/local/bin/duo2-ssc wait -t 90 accel
ExecStart=
ExecStart=/usr/local/libexec/iio-sensor-proxy
# libssc talks QRTR (Debian's 3.7 unit allows only AF_UNIX/AF_NETLINK; the
# lists add up).
RestrictAddressFamilies=AF_QIPCRTR
TimeoutStartSec=150
