<!doctype html>
<!-- duo2-os: a YouTube-like playback test (Media Source Extensions, DASH
     segments, quality switches) for the browsers' hardware decoders.

     ?codec=h264|vp9   which clip set (scripts/duo2-video-test web makes them:
                       DIR/<codec>/<rep>/init.<ext> and seg-NNNNN.<ext>,
                       listed in DIR/manifest.json)
     &rep=1080         the rendition to play (default: the largest)
     &switch=1         change rendition every SWITCH_EVERY segments, the way
                       YouTube changes quality: a new init segment in the same
                       SourceBuffer, so the decoder sees a resolution change
                       in the middle of the stream

     The clip set is appended over and over (timestampOffset), so the video
     runs as long as the page is open. Once a second the title reads like
     tools/video/test.html's, "vt shown=… dec=… drop=… WxH …", plus
     switches=N and err=…, for browser-video-measure (the window title is in
     duo-wc's state), and the same line goes to the console (Chromium's
     --enable-logging=stderr writes it to its log). -->
<html><head><meta charset="utf-8"><title>vt starting</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}
video{width:100vw;height:100vh;object-fit:contain;display:block}</style></head>
<body><video id="v" muted autoplay playsinline></video>
<script>
'use strict';
const SWITCH_EVERY = 3;
const v = document.getElementById('v');
const q = new URLSearchParams(location.search);
const codec = q.get('codec') || 'h264';
let switches = 0, err = '', shown = 0, last = performance.now(), lastQ = null;

function report() {
  const now = performance.now(), dt = (now - last) / 1000; last = now;
  const pq = v.getVideoPlaybackQuality();
  const dDec = lastQ ? pq.totalVideoFrames - lastQ[0] : 0;
  const dDrop = lastQ ? pq.droppedVideoFrames - lastQ[1] : 0;
  lastQ = [pq.totalVideoFrames, pq.droppedVideoFrames];
  const line = `vt shown=${(shown / dt).toFixed(1)} dec=${(dDec / dt).toFixed(1)} drop=${(dDrop / dt).toFixed(1)} ` +
    `${v.videoWidth}x${v.videoHeight} t=${v.currentTime.toFixed(1)} switches=${switches} ${codec}` +
    (err ? ` err=${err}` : '');
  document.title = line;
  console.log('DUO2TEST ' + line);
  shown = 0;
}
function onFrame() { shown++; v.requestVideoFrameCallback(onFrame); }
v.requestVideoFrameCallback(onFrame);
v.addEventListener('error', () => { err = 'media:' + (v.error ? v.error.code + ':' + v.error.message : '?'); });

const fetchBuf = (url) => fetch(url).then((r) => {
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  return r.arrayBuffer();
});
const appended = (sb, buf) => new Promise((resolve, reject) => {
  sb.addEventListener('updateend', resolve, { once: true });
  sb.addEventListener('error', () => reject(new Error('SourceBuffer error')), { once: true });
  sb.appendBuffer(buf);
});
const removed = (sb, start, end) => new Promise((resolve) => {
  sb.addEventListener('updateend', resolve, { once: true });
  sb.remove(start, end);
});

async function run() {
  const manifest = await (await fetch('manifest.json')).json();
  const set = manifest[codec];
  if (!set) throw new Error(`no clip set "${codec}"`);
  const reps = Object.keys(set.reps).sort((a, b) => a - b);
  let rep = q.get('rep') || reps[reps.length - 1];
  if (!MediaSource.isTypeSupported(set.mime)) throw new Error(`MSE says no to ${set.mime}`);
  const ms = new MediaSource();
  v.src = URL.createObjectURL(ms);
  await new Promise((resolve) => ms.addEventListener('sourceopen', resolve, { once: true }));
  const sb = ms.addSourceBuffer(set.mime);
  let loop = 0, current = null;
  for (;;) {
    sb.timestampOffset = loop * set.duration;
    for (let i = 1; i <= set.segments; i++) {
      if (q.get('switch') === '1' && i > 1 && (i - 1) % SWITCH_EVERY === 0) {
        rep = reps[(reps.indexOf(rep) + 1) % reps.length];
      }
      const dir = `${codec}/${rep}`;
      if (current !== rep || i === 1) {
        if (current !== null && current !== rep) switches++;
        await appended(sb, await fetchBuf(`${dir}/init.${set.ext}`));
        current = rep;
      }
      await appended(sb, await fetchBuf(`${dir}/seg-${String(i).padStart(5, '0')}.${set.ext}`));
      // Keep about 20 s ahead and 10 s behind the playhead.
      while (sb.buffered.length && sb.buffered.end(sb.buffered.length - 1) - v.currentTime > 20) {
        await new Promise((resolve) => setTimeout(resolve, 500));
      }
      if (v.currentTime > 15) await removed(sb, 0, v.currentTime - 10);
    }
    loop++;
  }
}
setInterval(report, 1000);
run().catch((e) => { err = String(e.message || e).replace(/\s+/g, '_'); console.log('DUO2TEST error ' + err); });
</script></body></html>
