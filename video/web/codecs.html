<!doctype html>
<!-- duo2-os: what a browser tells a page like YouTube about its video codecs.

     For each codec string a YouTube player asks about (1080p30: H.264 High,
     VP9 profile 0, AV1 Main 8-bit, HEVC Main for information): the answers
     of MediaSource.isTypeSupported, canPlayType and
     navigator.mediaCapabilities.decodingInfo (type media-source: supported,
     smooth, powerEfficient). This is what a YouTube player is told before
     it picks a codec (it serves AV1 to a browser that says yes to av01).
     powerEfficient is only a hint: Chromium takes it from its hardware
     decoder's profiles where it asks the GPU side, but from its playback
     history otherwise, which is optimistic (true) for a fresh profile, so
     it means something only next to a run of the same browser with
     hardware decoding off (duo2-video-test: chromium-sw / chromium-v4l2).

     One line per codec on the page and in the console ("DUO2TEST codecs …",
     for browser-video-measure's log: Chromium with --enable-logging=stderr,
     QtWebEngine with QT_LOGGING_RULES=js.info=true), then the title
     "vt codecs done N" (N = codecs reported powerEfficient). Opens no media
     device itself; the browser may, to answer. -->
<html><head><meta charset="utf-8"><title>vt codecs starting</title>
<style>html,body{margin:0;background:#000;color:#ddd;font:16px/1.4 monospace}
pre{margin:16px;white-space:pre-wrap;word-break:break-all}</style></head>
<body><pre id="out"></pre>
<script>
'use strict';
const out = document.getElementById('out');
const CODECS = [
  ['h264', 'video/mp4; codecs="avc1.640028"'],
  ['vp9', 'video/webm; codecs="vp09.00.40.08"'],
  ['av1', 'video/mp4; codecs="av01.0.08M.08"'],
  ['hevc', 'video/mp4; codecs="hvc1.1.6.L120.90"'],
];
const say = (line) => {
  out.textContent += line + '\n';
  console.log('DUO2TEST ' + line);
};
(async () => {
  say('codecs ua=' + navigator.userAgent);
  let hw = 0;
  for (const [name, type] of CODECS) {
    const mse = typeof MediaSource !== 'undefined' && MediaSource.isTypeSupported(type);
    const can = document.createElement('video').canPlayType(type) || 'no';
    let dec = 'n/a';
    try {
      const r = await navigator.mediaCapabilities.decodingInfo({
        type: 'media-source',
        video: { contentType: type, width: 1920, height: 1080, bitrate: 4000000, framerate: 30 },
      });
      dec = `supported=${r.supported} smooth=${r.smooth} powerEfficient=${r.powerEfficient}`;
      if (r.supported && r.powerEfficient) hw++;
    } catch (e) {
      dec = 'error=' + e.name;
    }
    say(`codecs ${name} mse=${mse} canPlayType=${can} ${dec}`);
  }
  document.title = `vt codecs done ${hw}`;
  say(`codecs done powerEfficient=${hw}`);
})();
</script>
</body></html>
