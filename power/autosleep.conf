# duo2-autosleep (/etc/duo2/autosleep.conf; read at start: systemctl restart
# duo2-autosleep after a change, except stay_awake_charging, read again
# whenever this file changes). The switch is not here: while the file
# /etc/duo2/autosleep-hold exists, the phone is never suspended by it, nor
# before the end in /etc/duo2/autosleep-hold-until (duo2-autosleep-switch
# hold 2h: a timed hold for remote work, lapses by itself).

# seconds with both panels dark before the phone sleeps
delay = 20
# seconds awake at least after every resume (a modem or WiFi wake, a timer),
# counted from the moment WiFi answers again
resume_grace = 15
# seconds to wait for WiFi after a resume before sleeping without it
wifi_wait = 45
# seconds awake after a wake by the modem alone (an SMS, a network report;
# a ringing call holds the phone awake by itself), without waiting for WiFi
modem_grace = 8
# seconds awake after a wake by a request of the modem alone (it reads or
# writes its EFS through rmtfs: nothing for the user, rmtfs answers at once)
request_grace = 3
# seconds between checks while something holds the phone awake
check_interval = 10
# wake this many seconds before a Clocks alarm (Clocks rings only when awake)
alarm_lead = 45
# wake every this many seconds even with nothing to do (0 = never)
wake_every = 0
# an open ssh session of these users keeps the phone awake (comma separated)
ssh_users = duo2admin
# the GUI user (its Clocks alarms and media players count; the low-battery
# notification goes to its session); empty: duo-wc's user
user =
# on battery power at or below this many percent the phone powers off (0 =
# never; also with automatic sleep held). Asleep it wakes to look: every sleep
# on battery ends after half the time the margin above this level lasts at
# sleep_drain_ma (or the drain measured in the last long sleep, if more)
poweroff_level = 3
# seconds the "Battery empty" notification shows before that, with a panel lit
poweroff_notice = 30
# mA assumed drawn asleep (the highest seen: ~290 mA with 5G NR up)
sleep_drain_ma = 300
# WiFi in sleep: off = the WLAN chip is powered off in every sleep (WiFi
# reconnects after the resume, nothing over WiFi wakes the phone); wowlan =
# it stays associated (WoWLAN) and wakes the phone for wowlan_wake. WoWLAN
# needs a kernel that keeps the PCIe link up for it (docs/hardware/power.md)
wifi_sleep = off
# what wakes the phone in WoWLAN (comma separated): tcp (TCP to the phone's
# own addresses: push connections, ssh), unicast (any frame to its MAC), ping
# (echo requests to it), magic (a Wake-on-LAN packet), disconnect (the access
# point drops it)
wowlan_wake = tcp,disconnect
# seconds awake after a wake by the WiFi (a push came), counted from WiFi's
# answer: the app fetches the message and posts its notification
wifi_grace = 12
# WoWLAN sleeps in a row after which WiFi did not answer within wifi_wait:
# then WoWLAN is switched off until duo2-autosleep restarts
wowlan_max_failures = 2
# on WiFi without WoWLAN: wake this often (seconds) to let WiFi reconnect and
# the push connections deliver what waits (0 = never)
wifi_sync_every = 0
# seconds awake after such a sync wake, counted from WiFi's answer
sync_grace = 20
# a command run (as root) once WiFi answers after a sync wake, empty = none;
# /usr/local/sbin/duo2-push-poke asks Waydroid's Play services to check in
sync_hook =
# on external power (a charger, a computer's USB port) the phone does not
# sleep: on | off. The panels still go dark on their timeout; plugged in it
# stays reachable over the network (remote work). Not while the battery is
# at or below 10 % and not charging (a source too weak for the awake phone:
# asleep it charges). duo2-autosleep-switch charging on|off and Duo
# Settings > Battery change it; the daemon reads it again by itself
stay_awake_charging = on
