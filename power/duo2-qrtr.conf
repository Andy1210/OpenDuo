# duo2-os (power/, docs/hardware/power.md): which QMI services' indications
# wake the phone from sleep (the IPC router's filter for a wakeup-source
# remote): 5 = WMS (SMS), 9 = Voice (incoming call), 400 = the sensor DSP's
# sensor service (only the sensors duo-posed asks to send while asleep:
# opening / closing the phone). Requests from the remotes to local servers
# wake it too (wake_requests).
options qrtr wake_services=5,9,400
