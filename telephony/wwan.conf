# duo2-os: the modem and mobile data (duo2-wwan, telephony/README.md).
# Read when duo2-wwan starts: sudo systemctl restart duo2-wwan
# (the package default is /etc/duo2/wwan.conf.dist; this file is never overwritten).

# Switch the modem on (online, registered) when a usable SIM is present:
# needed for calls and SMS. no = the modem stays in low-power (RF off).
ENABLE=yes

# Mobile data while registered. WiFi stays the default route while it is up
# (ROUTE_METRIC is above networkd's 1024 for WiFi); the bearer stays connected
# in the background so data is there the moment WiFi goes.
DATA=yes

# Access point. Empty = the network's default (LTE attach), which works on
# most networks: try that first. ALDI TALK (Telefonica o2 network, ex E-Plus):
#   APN=internet.eplus.de  APN_USER=eplus  APN_PASSWORD=gprs
# (mobile-broadband-provider-info 20250613; on LTE the user/password are not
# checked). Telekom's network (262-01), only if the network's default gives
# no data, with the user name and password the provider gives:
#   APN=internet.telekom
APN=
APN_USER=
APN_PASSWORD=
IP_TYPE=ipv4v6

# Data while roaming (in the EU at home prices, but still: no by default).
ROAMING=no

# Default-route metric of the mobile data device (WiFi: 1024).
ROUTE_METRIC=4096

# Which physical slot becomes the primary subscription when the modem has none
# and a SIM is found (1 = nano-SIM tray, 2 = built-in eSIM): duo2-sim auto.
PROVISION_SLOT=1

# Smart 5G: 5G NR (NSA) only while mobile data is on, a panel is lit and WiFi
# is not the default route; otherwise the modem's mode preference without NR
# (with NR the modem never sleeps, even with no data). Applied by duo2-wwan's
# own QMI client "until the modem restarts" (never a permanent modem setting).
# no = the modem's own preference, untouched.
SMART_5G=yes

# Smart 5G and the hotspot (hotspot/): devices connected to the phone's
# hotspot count as data in use, so 5G NR is allowed while they are there
# (also with the panels dark and the phone itself on WiFi), when the user's
# "Use 5G for the hotspot" is on (Duo Settings > Hotspot). no = the hotspot
# changes nothing.
SMART_5G_HOTSPOT=yes

# Emergency calls without a usable SIM: with no SIM, or a SIM waiting for its
# PIN or PUK, ModemManager never switches the radio on, so 112 could not go
# out. yes = the radio is put online anyway (the modem camps on any network,
# "emergency calls only", as every phone does; it costs some standby power
# while the SIM is missing or locked); never in airplane mode. An emergency
# call dialled with the radio off (airplane mode, ENABLE=no, this set to no)
# switches it on in any case (telephony/README.md "Emergency calls").
EMERGENCY_RADIO=yes

# A number duo2-wwan alone treats as an emergency number, to try the radio-off
# path (airplane mode: airplane off, the modem on, dialled again) with an
# ordinary call instead of 112: e.g. your other phone (digits only, no spaces).
# Empty = none. Only for a test, then empty it again (the lock screen never
# offers it).
EMERGENCY_TEST_NUMBER=
