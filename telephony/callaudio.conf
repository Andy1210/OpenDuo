# duo2-callaudio (telephony/README.md, docs/hardware/audio.md).
# Read at start: systemctl --user restart duo2-callaudio (as the GUI user).
#
# The call volume (PipeWire's volume of the card's Voice Call sink: the
# volume keys during a call) sets the WSA digital gain, register value
# 84 = 0 dB, 1 dB per step, the machine driver allows at most 81 (-3 dB).
# 100 % gives the device's maximum below, every percent below 100 is
# RANGE_DB / 100 dB lower, 0 % (or muted) is silence.
#
# EARPIECE_MAX: the earpiece amplifier runs in its Speaker mode (stronger
# than the stock Receiver mode), so only the digital gain keeps it at a level
# for the ear. Raise it in small steps, with the phone away from the ear.
EARPIECE_MAX=52
# SPEAKER_MAX: both loudspeakers (no speaker protection: stay well below 81)
SPEAKER_MAX=75
RANGE_DB=40
# The DSP's uplink processing (no calibration data, the DSP's defaults):
# none = the microphone as it is; ecns = echo canceller + noise suppression
# (single mic). With the speakers on, "none" may let the other party hear
# themselves: try ecns then.
TX_TOPOLOGY=none
# The ALSA card id and the voice front ends' PCM devices (VoiceMMode1/2)
CARD=MicrosoftSurfac
VOICE_PCMS=3 4
