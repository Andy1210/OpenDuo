# duo2-os (/etc/systemd/system/ModemManager.service.d/duo2.conf).
#
# Probe the modem only after it has left 'shutting-down' (duo2-modem-lpm.service).
# That also gives the qcom-soc plugin both of its ports at once: the IPA network
# device (rmnet_ipa0) registers when the modem runs, the QRTR services (the
# control port) come a little later, and duo2-modem-lpm waits for those. A net
# port added after the probe is not taken ("Failed to find a net port").
#
# Quick suspend/resume, as on other Linux phones: the modem runs on while the
# AP sleeps (it is what wakes the AP for a call or an SMS), so ModemManager
# only syncs its state on resume. Its default removes every modem before sleep
# and probes them again after it (~30 s of init on this modem, the SIM and the
# registration lost to Calls and Chatty in the meantime, data reconnected).
[Unit]
Wants=duo2-modem-lpm.service
After=duo2-modem-lpm.service

#
# The SIM's primary subscription is opened before ModemManager starts
# (duo2-sim boot-wait): otherwise ModemManager gives up on the SIM at boot
# and has to be restarted a minute later (2026-11-08: data ~2 min after boot).
[Service]
ExecStartPre=-/usr/local/sbin/duo2-sim boot-wait
TimeoutStartSec=90
ExecStart=
ExecStart=/usr/sbin/ModemManager --test-quick-suspend-resume
