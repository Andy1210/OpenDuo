[package]
name = "duo-wc"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Wayland compositor for the Surface Duo 2: two panels, one desktop"
license = "MIT"
keywords = ["wayland", "compositor", "smithay", "surface-duo", "kms"]
categories = ["gui"]

[dependencies]
anyhow = "1.0"
# Same calloop smithay re-exports (features are additive): SIGTERM has to end
# the loop rather than the process, so the session's Drop runs.
calloop = { version = "0.14", features = ["signals"] }
libc = "0.2"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# A protocol Smithay has not got (phoc's device state, src/devicestate.rs) is
# generated by wayland-scanner, and its code names bitflags; both are in the
# tree already (wayland-server, wayland-protocols), at the same versions.
bitflags = "2"
wayland-scanner = "0.31"

# Pinned to one revision. Bump deliberately.
[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "ff5fa7df392cecfba049ffed55cdaa4e98a8e7ef"
default-features = false
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    # also what gives libinput its udev context
    "backend_udev",
    "desktop",
    "renderer_gl",
    "use_system_lib",
    "wayland_frontend",
    # X11 apps (Krita: Qt5 forces xcb) through Xwayland (src/xwayland.rs).
    "xwayland",
]

[profile.release]
debug = "line-tables-only"
