<!doctype html>
<!-- Fullscreen video test for duo-wc: plays ?v=FILE muted in a loop over the
     whole window and reports in the title, once a second, what the video
     pipeline did: frames shown per second (requestVideoFrameCallback),
     decoded / dropped totals (getVideoPlaybackQuality) and the page's own
     rAF rate. tools/video-measure.sh reads the title from duo-wc's state. -->
<html><head><meta charset="utf-8"><title>vt starting</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}
video{width:100vw;height:100vh;object-fit:contain;display:block}</style></head>
<body><video id="v" muted loop autoplay playsinline></video>
<script>
const v = document.getElementById('v');
const q = new URLSearchParams(location.search);
v.src = q.get('v') || 'h264-1080p30.mp4';
let shown = 0, raf = 0, last = performance.now(), lastQ = null;
function onFrame() { shown++; v.requestVideoFrameCallback(onFrame); }
v.requestVideoFrameCallback(onFrame);
// ?raf=0: no animation-frame loop of our own (a plain video page); the
// count then reads 0.
function onRaf() { raf++; requestAnimationFrame(onRaf); }
if (q.get('raf') !== '0') requestAnimationFrame(onRaf);
setInterval(() => {
  const now = performance.now(), dt = (now - last) / 1000; last = now;
  const pq = v.getVideoPlaybackQuality();
  const dec = pq.totalVideoFrames, drop = pq.droppedVideoFrames;
  const dDec = lastQ ? dec - lastQ[0] : 0, dDrop = lastQ ? drop - lastQ[1] : 0;
  lastQ = [dec, drop];
  document.title = `vt shown=${(shown/dt).toFixed(1)} raf=${(raf/dt).toFixed(1)} dec=${(dDec/dt).toFixed(1)} drop=${(dDrop/dt).toFixed(1)} ${v.videoWidth}x${v.videoHeight} win=${innerWidth}x${innerHeight}@${devicePixelRatio}`;
  shown = 0; raf = 0;
}, 1000);
</script></body></html>
