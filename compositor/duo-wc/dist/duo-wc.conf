# duo-wc defaults (read at start; the hinge gap and the idle timeout can also
# be changed live with `duoctl set_hinge_gap on|off` / `duoctl set_idle_timeout`).

# on:  the right panel starts 66 px (physical) past the left one, as if the
#      picture went on under the hinge: spanning content is continuous.
# off: the panels are adjacent; nothing is hidden behind the hinge.
hinge_gap = on

# Output scale for both panels (~400 ppi). Fractional values reach clients
# through wp_fractional_scale_v1; others draw at the next integer.
scale = 2.5

# Seconds without a touch or a key until both panels go off; 0 = never.
# The power key (short press) brings them back.
idle_timeout = 60

# on: an app that asks keeps the screen from going off by itself while its
#     window is seen (a video in mpv, Firefox, Chromium, Celluloid; a map):
#     zwp_idle_inhibit_manager_v1, and org.freedesktop.ScreenSaver through
#     the shell. Never a dark, locked or home screen; the power key still
#     switches it off. off: the idle timeout always blanks. Live: duoctl
#     set_idle_inhibit on|off. Commented out (the default) so an older duo-wc
#     still reads this file.
#idle_inhibit = on

# on: a touch on a dark screen wakes it (the waking touch is not delivered).
# off: only the power key wakes, as on a phone (a pocket is full of touches).
touch_wake = off

# on: the power key, after switching the panels off, also suspends the phone.
# Off by default: the phone is reached over WiFi and an unattended suspend
# loses it. Needs logind to allow the duo-wc user to suspend (polkit).
power_key_suspend = off

# on: swipes from a panel's edges (the outer ~3 mm) belong to the compositor
#     and the shell: bottom up = dock (short), home (long), the overview
#     (swipe and hold); top down = the quick menu; left or right inwards =
#     back. A touch that starts in such a strip reaches the app only once it
#     is clearly not a swipe (or, at the sides and the top, after 350 ms).
# off: every touch goes straight to the app under it.
edge_swipe = on

# The rest is commented out (the defaults) so an older duo-wc still reads
# this file.
# Which side edges swipe back: both (each panel's left and right edge),
# outer (only the edges away from the hinge), off.
#back_swipe = both
# How deep the edge strips are, logical px (8 to 60; 20 = ~3 mm).
#edge_zone = 20
# Windows open, fly to where they were dropped and go home on springs.
#animations = on
# A turned panel: its picture turns to the new orientation in this many ms
# (eased in and out, scaled to fit, never stretched), cross-fading into the
# redrawn apps; 0 = it jumps.
#rotate_anim_ms = 320
# A window (or an overview card) carried snaps: at the hinge (within this
# many px of the hinge-side edge) to the OTHER panel; within this share of a
# panel's edge to that half (when another window is there to share it); on
# the span pad (drawn while carrying: a stretch of the hinge, from
# snap_pad_from to snap_pad_to of the panels' length along it) to both.
#snap_hinge_band = 40
#snap_half_share = 0.22
#snap_pad_from = 0.58
#snap_pad_to = 0.80
# Carrying across the hinge (two touchscreens): a drag that lifts within
# stitch_edge px of the hinge-side edge goes on if the other panel is
# touched at its hinge-side edge within stitch_ms, within stitch_offset px
# along the hinge. Tune for real fingers; live: duoctl set_stitch.
#stitch_edge = 56
#stitch_ms = 350
#stitch_offset = 120
# Android apps (Waydroid): a double tap on the middle of an Android window's
# caption bar makes it full screen: the window moves up by android_caption
# px (the bar off the glass; android_shadow is the layer's shadow margin
# above the bar) and android_task_helper (root, through sudo -n) sizes the
# app's task inside Android to fill it. A double tap on its top brings it back.
#android_caption = 43
#android_shadow = 10
#android_task_helper = /usr/local/sbin/duo2-android-task
# The panels the closed phone's glance lights (both | DSI-1 | DSI-2): only
# the right panel's hinge-side edge shows from outside; and the peek's.
#glance_panels = DSI-2
#peek_panels = DSI-2

# Diagnostics (the touch flicker hunt; also live: duoctl set_full_redraw /
# set_scanout). full_redraw = on draws every frame whole; scanout = off never
# scans client buffers out on planes.
full_redraw = off
scanout = on

# Waking the screen: one blocking modeset per panel, its first frame in it
# (off, the default since 2026-11-08), or non-blocking wake commits without
# planes, the picture after them (on). With "on" a panel left on its black
# first frame while the other one came up often stayed dark (the left one,
# seconds, until a new frame). Live: duoctl set_atomic_wake on|off. Kept
# commented out here so an older duo-wc (which does not know the key) still
# reads this file.
#atomic_wake = off
# Blanking the screen: both panels go off in ONE atomic commit that does not
# block the compositor (on), or one blocking switch-off per panel (off, the
# old way, ~170 ms each). Live: duoctl set_atomic_off on|off. Commented out
# for the same reason as atomic_wake.
#atomic_off = on

# The lock screen (ext-session-lock-v1): off = no client can lock the phone
# (the global is not even offered). Turn on only with a PIN set for the lock
# client (shell/duo-shell README, "Lock screen"); duoctl unlock is the way
# back over ssh. Kept commented out here so an older duo-wc still reads this.
#session_lock = off

# Who may drive the compositor (docs/hardware/security.md). The GUI user's
# programs (apps) get the state, the event stream and the launch hint on
# duo-wc.sock, nothing more; the session (the shell, the lock, the on-screen
# keyboard) is trusted through the trust factory duo-wc hands it. The admin
# socket (admin.sock) answers root always, these users with everything (the
# ssh tooling's administrator) ...
#admin_users = duo2admin
# ... and these with the posture, pose, rotation and panel power (duo-posed).
# Commented out (the defaults) so an older duo-wc still reads this file.
#sensor_users = duo-posed
# ... and these with `confirm` only: a question to the user in the shell
# (polkit, before PackageKit removes packages).
#confirm_users = polkitd

# An external display on the USB-C port (a USB-C to HDMI / DP adapter, the
# DisplayPort alt mode): the desktop mode (README "External display"). The
# windows there float; the pointer (a Bluetooth or USB mouse) moves them.
# Commented out (the defaults) so an older duo-wc still reads this file.
#external = on                 # off: a plugged display is left dark
#external_scale = auto         # auto (from the size it reports) or 1 to 4
#external_mode = auto          # auto | preferred | 1920x1080[@60]
#external_idle_timeout = 600   # seconds while a display is up or laptop mode is on (0 never; panels: idle_timeout)
#external_trackpad = off       # DSI-1 | DSI-2: that panel is the display's touchpad

# The keyboard layouts (a plugged keyboard, laptop mode's keys) are the
# system's list (Duo Settings > Keyboard; the shell sends it, README
# "Laptop mode"); these are only the start until the first one comes (empty
# is us). xkb_options and xkb_model always count.
#xkb_layout = hu
#xkb_variant =
#xkb_options = grp:alt_shift_toggle   # with two layouts: Alt+Shift switches

# Laptop mode (README "Laptop mode"): one panel a desk (floating windows,
# a taskbar, a pointer), the other a keyboard and a touchpad. Turned on in
# Duo Settings or `duoctl set_laptop on`; these say when it comes by itself
# and which panel is the keyboard. Commented out (the defaults) so an older
# duo-wc still reads this file.
#laptop_auto = off             # on: the laptop posture (one half flat, the other up) turns it on
#laptop_keys = DSI-2           # the keyboard panel when the phone is not turned to landscape

# The touchpads (laptop mode's, an external display's touchpad panel):
# tap, then touch again and move = a drag with the left button held.
#touchpad_drag_lock = off      # on: a drag goes on through a lift shorter than 0.3 s

# The pen (Duo Settings > Pen; live with duoctl set_pen). Commented out (the
# defaults) so an older duo-wc still reads this file.
#pen_button = right_click      # right_click | off: the side button, for apps without pen support,
#                              # where there is a pointer (laptop mode, a mouse)
#pen_dot = on                  # on: a dot shows where a hovering pen points
#pen_input = apps              # apps: only the drawing apps of pen_apps get the pen as a pen
#                              # (pressure, tilt, hover); every other app gets it as a finger
#                              # (it scrolls, taps, long-presses); all: every app that takes one
#pen_apps = rnote, xournalpp, krita, gimp, inkscape, mypaint, org.duo2os.PenTest, org.duo2os.Nibfair
#                              # app ids or their last part, any case (X11: the WM_CLASS)

# X11 apps (Krita, xterm: README "X11 apps"): Xwayland on duo-wc's own X
# display (DISPLAY in the session). Commented out (the default) so an older
# duo-wc still reads this file.
#xwayland = lazy               # lazy: started by the first X11 client, stopped a minute after
#                              # the last X11 window; on: with the session; off: no X11
