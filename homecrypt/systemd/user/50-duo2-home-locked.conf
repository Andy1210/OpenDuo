# homecrypt/README.md: not before the first unlock of an encrypted home. Until
# then the home is an empty tmpfs (gone at the unlock), and this service would
# keep what it receives there: SMS (Chatty: they stay in ModemManager and
# arrive at the unlock), MMS (mmsd-tng), Android's data (Waydroid).
[Unit]
ConditionPathExists=!/run/duo2-home/locked
